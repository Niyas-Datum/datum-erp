<div class="popup-overlay">
  <div class="popup-content">
    <div class="popup-header">
      <h5>Advance allocation</h5>
      <button type="button" class="close-btn" (click)="onCancelClick()" aria-label="Close"></button>
    </div>

    <ejs-grid
      #advGrid
      [dataSource]="displayRows"
      [allowSelection]="true"
      [selectionSettings]="selectionSettings"
      [ngClass]="{ 'disable-header-select': crdrAmount > 0 && remainingAmount <= 0 }"
      (rowSelecting)="onRowSelecting($event)"
      (rowSelected)="onRowSelected($event)"
      (rowDeselected)="onRowDeselected($event)"
      (dataBound)="syncSelectionCheckboxes()"
      height="400px">
      <e-columns>
        <e-column type="checkbox" width="50"></e-column>
        <e-column field="invoiceNo" headerText="Voucher No" width="120" [isPrimaryKey]="true"></e-column>
        <e-column field="invoiceDate" headerText="Date" width="120"></e-column>
        <e-column field="partyInvNo" headerText="Party Inv No" width="120"></e-column>
        <e-column field="partyInvDate" headerText="Party Inv Date" width="120"></e-column>
        <e-column field="description" headerText="Description" width="150"></e-column>
        <e-column field="account" headerText="Account" width="100"></e-column>
        <e-column field="invoiceAmount" headerText="Amount" width="130" textAlign="Right" format="N2"></e-column>
        <e-column field="allocated" headerText="Allocated" width="120" textAlign="Right" format="N2"></e-column>
        <e-column field="amount" headerText="This alloc." width="120" textAlign="Right" format="N2"></e-column>
        <e-column field="balance" headerText="Balance" width="120" textAlign="Right" format="N2"></e-column>
      </e-columns>
    </ejs-grid>

    <div class="footer-totals">
      <div class="total-row">
        <span class="label">Invoice amount (selected):</span>
        <span class="value">{{ formatCurrency(totalInvoiceAmount) }}</span>
      </div>
      <div class="total-row">
        <span class="label">Pay / cap amount:</span>
        <span class="value">{{ formatCurrency(totalPayAmount) }}</span>
      </div>
      <div class="total-row">
        <span class="label">Allocated:</span>
        <span class="value">{{ formatCurrency(totalAllocatedAmount) }}</span>
      </div>
      <div class="total-row">
        <span class="label">Remaining:</span>
        <span class="value" [class.negative]="totalBalanceAmount < 0">
          {{ formatCurrency(totalBalanceAmount) }}
        </span>
      </div>
    </div>

    <div class="popup-footer">
      <button type="button" class="btn btn-primary" (click)="onOkClick()">OK</button>
      <button type="button" class="btn btn-secondary" (click)="onCancelClick()">Cancel</button>
    </div>
  </div>
</div>
