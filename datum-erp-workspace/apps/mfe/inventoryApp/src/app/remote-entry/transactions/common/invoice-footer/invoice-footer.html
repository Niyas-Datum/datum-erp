<!-- Common Component -->
<div class="w-100 h-100 d-flex flex-column overflow-hidden ">
  <form [formGroup]="salesForm" class="border flex-grow-1 d-flex flex-column ">

    <div class="section-content flex-grow-1 container-fluid mt-1">

      <!-- TERMS-->
      <div class="row g-3 align-items-end">

        <!-- Terms -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 me-4">Terms</label>
            <ejs-textbox formControlName="terms" class="flex-grow-1"></ejs-textbox>
          </div>
        </div>

        <!-- Discount % -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Total Disc %</label>
            <ejs-textbox formControlName="totaldiscpercent"
              (change)="onChangeCommonDiscountPercent($event)"
              class="flex-grow-1">
            </ejs-textbox>
          </div>
        </div>

        <!-- Discount Amount -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Discount Amount</label>
            <div class="d-flex flex-grow-1 gap-2">
              <ejs-textbox formControlName="discountamount"
                (change)="onChangeCommonDiscountAmount($event)"
                class="flex-grow-1">
              </ejs-textbox>
              <button type="button" class="btn btn-secondary">Apl</button>
            </div>
          </div>
        </div>

        <!-- Disc Sell Amt -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Disc Sell Amt</label>
            <ejs-textbox formControlName="discsellamt"
              (change)="onChangeDiscSellAmount($event)"
              class="flex-grow-1">
            </ejs-textbox>
          </div>
        </div>

        </div>
      </div>
      <div class="container-fluid roundoff-container-start">

      <!-- ROUND / TAX / TOTAL -->
      <div class="row g-3">

        <!-- Round Off -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Round Off</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="roundoff" class="flex-grow-1"></ejs-textbox>
              <button class="btn btn-secondary btn-sm">...</button>
            </div>
          </div>
        </div>

        <!-- Tax -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label ">Tax</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="tax" class="flex-grow-1 "></ejs-textbox>
              <button class="btn btn-secondary btn-sm">...</button>
            </div>
          </div>
        </div>

        <!-- Add Charges -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label me-4">Add. Charges</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="addcharges" class="flex-grow-1"></ejs-textbox>
              <button class="btn btn-secondary btn-sm">...</button>
            </div>
          </div>
        </div>

        <!-- Net Amount -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Net Amount</label>
            <ejs-textbox formControlName="netamount" [readonly]="true" class="flex-grow-1"></ejs-textbox>
          </div>
        </div>

        </div>

      <!-- GRAND TOTAL -->
      <div class="d-flex justify-content-lg-end">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 fw-bold me-3">Grand Total</label>
            <ejs-textbox formControlName="grandtotal"
              [readonly]="true"
              class="flex-grow-1 fw-bold">
            </ejs-textbox>
          </div>

        </div>


      </div>

      <!-- PAYMENT TABS -->
      <div class="d-flex gap-3 mt-4 flex-wrap">
        <div class="payment-tab">Common payment methods</div>
        <div class="payment-tab">Additional payment methods</div>
      </div>

      <!-- PAYMENT SECTION -->
      <div class="row g-3 mt-1">

        <!-- Pay Type -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Pay Type</label>
            <ejs-dropdownlist
              class="flex-grow-1"
              formControlName="paytype"
              [dataSource]="payTypeObj"
              [fields]="{ text: 'name', value: 'id' }"
              (change)="onChangePayType($event)">
            </ejs-dropdownlist>
          </div>
        </div>

        <!-- Cash -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Cash</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="cash" class="flex-grow-1"></ejs-textbox>
              <button class="btn btn-secondary btn-sm" (click)="fetchCashPopup()">...</button>
            </div>
          </div>
        </div>

        <!-- Card -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Card</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="card" class="flex-grow-1 e-input"></ejs-textbox>
              <button class="btn btn-secondary btn-sm"  (click)="fetchCardPopup()" >...</button>
            </div>
          </div>
        </div>

        <!-- Advance -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Advance</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="advance" class="flex-grow-1"></ejs-textbox>
              <button type="button" class="btn btn-secondary btn-sm" (click)="openAdvanceAllocationPopup()">...</button>
            </div>
          </div>
        </div>

        <!-- Cheque -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Cheque</label>
            <div class="d-flex flex-grow-1 gap-1">
              <ejs-textbox formControlName="cheque" class="flex-grow-1"></ejs-textbox>
              <button class="btn btn-secondary btn-sm">...</button>
            </div>
          </div>
        </div>

        <!-- Due Date -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Due Date</label>
            <ejs-datepicker formControlName="duedate" class="flex-grow-1"></ejs-datepicker>
          </div>
        </div>

        <!-- Total Paid -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 ">Total Paid</label>
            <ejs-textbox formControlName="totalpaid" [readonly]="true" class="flex-grow-1"></ejs-textbox>
          </div>
        </div>

        <!-- Balance -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 fw-bold ">Balance</label>
            <ejs-textbox formControlName="balance" [readonly]="true" class="flex-grow-1"></ejs-textbox>
          </div>
        </div>

        </div>
      </div>



  </form>

</div>

<!-- <app-popup [popupData]="popupData" *ngIf="isPopupVisible" [visible]="isPopupVisible"     (closed)="closePopup()"  (itemSelected)="onPopupItemSelected($event)"></app-popup> -->
<app-paymentpopup *ngIf="showPopup" [popupData]="popupData" [bankData]="bankData" [popupType]="popupType"
  [grandTotal]="getGrandTotalForPopup()" (itemSelected)="onItemSelected($event)"
  (closePopup)="closePopup()"></app-paymentpopup>

<app-advance-popup
  *ngIf="showAdvancePopup"
  [advanceRows]="advancePopupRows"
  [crdrAmount]="getGrandTotalForAdvancePopup()"
  (confirmed)="onAdvanceConfirmed($event)"
  (closed)="onAdvanceClosed()">
</app-advance-popup>
